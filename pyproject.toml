[project]
name = "retail-enterprise-agents"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.5.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-dataplex>=1.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
