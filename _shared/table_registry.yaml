version: '1.0'
dataset: web3_enterprise_agents
domains:
  cex:
    display_name: Centralized Exchanges & Trading
    domain_id: cex
  infra:
    display_name: Blockchain Infrastructure & L2
    domain_id: infr
  defi:
    display_name: Decentralized Finance & Protocols
    domain_id: defi
agents:
  order_book_depth:
    domain: cex
    agent_id: ob_depth
    display_name: 'CEX: Order Book Depth & Spread Analytics'
    description: Analyzes bid-ask spread efficiency, top-of-book depth, order book
      imbalance, and slippage across major spot and perpetual trading pairs.
    tables:
    - snapshots
    - trades
  proof_of_reserves:
    domain: cex
    agent_id: por
    display_name: 'CEX: Proof of Reserves & Solvency'
    description: Audits on-chain wallet reserve assets versus exchange customer liability
      balances, verifying collateralization ratios and solvency margins.
    tables:
    - wallet_balances
    - user_liabilities
  whale_custody_flows:
    domain: cex
    agent_id: custody
    display_name: 'CEX: Whale Inflows & Custody Transfers'
    description: Tracks large on-chain deposit/withdrawal flows, hot and cold storage
      rebalancing, and exchange reserve drawdowns across major assets.
    tables:
    - large_transfers
    - hot_cold_rebalance
  l2_sequencer_throughput:
    domain: infra
    agent_id: l2_seq
    display_name: 'INFRA: L2 Sequencer & Blob Gas Throughput'
    description: Monitors Layer-2 rollup sequencing transaction rates (TPS), EIP-4844
      blob gas usage, batch verification intervals, and L1 settlement costs.
    tables:
    - block_metrics
    - blob_gas
  validator_rpc_health:
    domain: infra
    agent_id: rpc_val
    display_name: 'INFRA: RPC Latency & Validator Health'
    description: Tracks distributed RPC node endpoint latencies, validator uptime,
      attestation rates, and consensus slash risk events.
    tables:
    - node_uptime
    - slash_alerts
  mev_arbitrage_radar:
    domain: infra
    agent_id: mev
    display_name: 'INFRA: MEV & Sandwich Attack Radar'
    description: Detects maximal extractable value (MEV) activities including sandwich
      trades, cross-DEX spatial arbitrage, and private mempool bundle volumes.
    tables:
    - bundles
    - sandwich_trades
  dex_amm_liquidity:
    domain: defi
    agent_id: amm_liq
    display_name: 'DEFI: AMM Liquidity & Impermanent Loss'
    description: Analyzes automated market maker (AMM) pool depths, 24-hour volume-to-TVL
      ratios, fee generation, and historical impermanent loss.
    tables:
    - pools
    - swap_history
  lending_liquidation_risk:
    domain: defi
    agent_id: lending
    display_name: 'DEFI: Lending Health & Liquidation Risk'
    description: Monitors money market borrowing utilization, collateral health factor
      distributions, and identifies collateral positions approaching liquidation thresholds.
    tables:
    - collateral_positions
    - bad_debt_alerts
  yield_staking_optimizer:
    domain: defi
    agent_id: yield_opt
    display_name: 'DEFI: Liquid Staking & Yield Optimizer'
    description: Compares liquid staking token (LST) yields, reward distribution APRs,
      and optimizes risk-adjusted capital deployment across yield vaults.
    tables:
    - pool_apys
    - staking_rewards
  bridge_outflow_monitor:
    domain: defi
    agent_id: bridge
    display_name: 'DEFI: Cross-Chain Bridge & Outflow Monitor'
    description: Tracks cross-chain bridge transfer velocity, lock-and-mint vs burn
      liquidity imbalances, and alerts on anomalous multi-chain capital flight.
    tables:
    - transfer_events
    - pool_liquidity
