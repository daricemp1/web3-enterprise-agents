version: '1.0'
dataset: web3_enterprise_agents
domains:
  cex:
    display_name: Centralized Exchanges & Trading
    domain_id: cex
  infra:
    display_name: Blockchain Infrastructure & L2
    domain_id: infr
  defi:
    display_name: Decentralized Finance & Protocols
    domain_id: defi
agents:
  order_book_depth:
    domain: cex
    agent_id: ob_depth
    display_name: 'CEX: Order Book Depth & Spread Analytics'
    description: Analyzes bid-ask spread efficiency, top-of-book depth, order book
      imbalance, and slippage across major spot and perpetual trading pairs to optimize
      institutional order routing.
    tables:
    - snapshots
    - trades
  proof_of_reserves:
    domain: cex
    agent_id: por
    display_name: 'CEX: Proof of Reserves & Solvency'
    description: Verifies centralized exchange collateralization by comparing on-chain
      wallet holdings against declared customer liabilities in real-time to alert
      on solvency drift.
    tables:
    - wallet_balances
    - user_liabilities
  whale_custody_flows:
    domain: cex
    agent_id: custody
    display_name: 'CEX: Whale Inflows & Custody Transfers'
    description: Tracks institutional deposits, treasury movements, and exchange hot/cold
      wallet rebalancing to detect large-scale liquidity shifts before market impact.
    tables:
    - large_transfers
    - hot_cold_rebalance
  l2_sequencer_throughput:
    domain: infra
    agent_id: l2_seq
    display_name: 'INFRA: L2 Sequencer & Blob Gas Throughput'
    description: Monitors Layer-2 rollup sequencer health, transaction batch compression,
      EIP-4844 blob gas consumption, and L1 settlement costs to ensure uninterrupted
      network throughput.
    tables:
    - block_metrics
    - blob_gas
  validator_rpc_health:
    domain: infra
    agent_id: rpc_val
    display_name: 'INFRA: RPC Latency & Validator Health'
    description: Evaluates global RPC node latency, block proposal sync, validator
      attestation effectiveness, and peer counts to prevent consensus degradation
      and slashing.
    tables:
    - node_uptime
    - slash_alerts
  mev_arbitrage_radar:
    domain: infra
    agent_id: mev
    display_name: 'INFRA: MEV & Sandwich Attack Radar'
    description: Identifies frontrunning, sandwich attacks, backrunning arbitrage,
      and block builder priority fees to protect liquidity pools and traders from
      predatory MEV extraction.
    tables:
    - bundles
    - sandwich_trades
  dex_amm_liquidity:
    domain: defi
    agent_id: amm_liq
    display_name: 'DEFI: AMM Liquidity & Impermanent Loss'
    description: Analyzes automated market maker (AMM) pool depths, 24-hour volume-to-TVL
      ratios, fee generation, and impermanent loss to optimize liquidity provider
      yield.
    tables:
    - pools
    - swap_history
  lending_liquidation_risk:
    domain: defi
    agent_id: lending
    display_name: 'DEFI: Lending Health & Liquidation Risk'
    description: Tracks collateralization ratios, borrow utilization rates, health
      factor distributions, and impending underwater positions across major decentralized
      lending markets.
    tables:
    - collateral_positions
    - bad_debt_alerts
  yield_staking_optimizer:
    domain: defi
    agent_id: yield_opt
    display_name: 'DEFI: Liquid Staking & Yield Optimizer'
    description: Compares liquid staking token (LST) yields, reward distribution APRs,
      and peg discounts to optimize risk-adjusted capital deployment across DeFi vaults.
    tables:
    - pool_apys
    - staking_rewards
  bridge_outflow_monitor:
    domain: defi
    agent_id: bridge
    display_name: 'DEFI: Cross-Chain Bridge & Outflow Monitor'
    description: Tracks cross-chain bridge transfer velocity, lock-and-mint vs burn
      liquidity imbalances, and alerts on anomalous multi-chain capital flight.
    tables:
    - transfer_events
    - pool_liquidity
