    display_name: "Merchandising: Assortment Planning"
    domain: merchandising
    agent_id: aspl
    location: us-central1
    tables:
      - product_catalog             # -> merc_aspl_product_catalog
      - sales_by_sku                 # -> merc_aspl_sales_by_sku
      - planogram_space_allocation   # -> merc_aspl_planogram_space_allocation

