# Registry of agents sharing the `retail_ent_agents` BigQuery dataset, and the tables each owns.
#
# Every domain agent loads its data/*.csv seed files into this one shared dataset (see
# docs/superpowers/specs/2026-07-25-retail-merchandising-adk-agents-design.md section 6a, updated
# 2026-07-26) via `_shared/scripts/load_agent_data.py`. Collisions are prevented structurally, not
# just by convention: every agent gets a short, stable `agent_id` here, and the loader prefixes
# every table it loads for that agent with `<agent_id>_`. This means agents can freely use the
# same logical table name (e.g. two agents both calling something "sales_by_sku" in their own
# data/ folder) without colliding — they land as distinct physical tables (e.g.
# `ap_sales_by_sku` vs `vs_sales_by_sku`).
#
# `tables:` below lists each agent's LOGICAL table names (== its data/*.csv file stems, unprefixed).
# The actual BigQuery table name is always `<agent_id>_<logical_name>` — that's what belongs in a
# data_insights.yaml's authorized-table list, not the bare logical name.
#
# Update this file in the same change that scaffolds a new agent's data/ folder, or adds/renames/
# drops one of its tables. `agent_id` must stay short (2-4 lowercase letters) and, once assigned,
# must never change — table names loaded under the old id would silently orphan.

dataset: retail_ent_agents
project: REDACTED_GCP_PROJECT_ID

agents:
  assortment_planning:
    domain: merchandising
    agent_id: ap
    tables:
      - product_catalog        # -> ap_product_catalog
      - sales_by_sku            # -> ap_sales_by_sku
      - planogram_space_allocation  # -> ap_planogram_space_allocation
