# Registry of agents sharing the `retail_ent_agents` BigQuery dataset, and the tables each owns.
#
# Every domain agent loads its data/*.csv seed files into this one shared dataset (see
# docs/superpowers/specs/2026-07-25-retail-merchandising-adk-agents-design.md section 6a, updated
# 2026-07-26 -- local-only doc, gitignored, not on a fresh clone) via
# `_shared/scripts/load_agent_data.py`. Collisions are prevented structurally, not
# just by convention: every domain gets a fixed 4-letter `domain_id` here (under `domains:`) and
# every agent gets a fixed 4-letter `agent_id` (under `agents:`), and the loader prefixes every
# table it loads for that agent with `<domain_id>_<agent_id>_`. This means agents can freely use
# the same logical table name (e.g. two agents both calling something "sales_by_sku" in their own
# data/ folder) without colliding — they land as distinct physical tables (e.g.
# `merc_aspl_sales_by_sku` vs `<other_domain>_<other_agent>_sales_by_sku`).
#
# Originally a single free-length (2-4 char) `agent_id` with no domain component (e.g.
# `assortment_planning` -> `ap`); revised 2026-07-26 to this fixed domain_id+agent_id form for
# readability/organization as more domains and agents are added to the shared dataset.
#
# `tables:` below lists each agent's LOGICAL table names (== its data/*.csv file stems, unprefixed).
# The actual BigQuery table name is always `<domain_id>_<agent_id>_<logical_name>` — that's what
# belongs in a data_insights.yaml's authorized-table list, not the bare logical name.
#
# Each agent's data is self-contained, even when its real-world content overlaps with another
# agent's (e.g. `pricing_promotions`'s `product_catalog` holds the same 6 products as
# `assortment_planning`'s `product_catalog`) — this is deliberate duplication, not an oversight.
# An agent's `tables:` entries are always its own independent physical tables, loaded from its own
# `data/*.csv` files; never design an agent to read another agent's tables cross-agent (each
# agent's service account only ever gets table-level IAM on its own tables).
#
# When duplicating content across agents, reuse the same entity identifiers and align seed-data
# date windows with what's already established, so multiple agents read as one consistent
# business timeline rather than disjoint universes (added 2026-07-26, first exercised by
# `vendor_performance` reusing `assortment_planning`/`pricing_promotions`'s SKU-001..006 ids and
# `WINDOW_END = 2026-07-24` date anchor):
#   - **Same identifiers for the same real-world entity.** If a new agent's data references an
#     entity another agent already established (e.g. a SKU), reuse that agent's exact identifier
#     values (e.g. `SKU-001`) rather than inventing new ones, even though the tables themselves
#     stay physically independent per the duplication rule above.
#   - **Same date anchor/overlapping windows.** Anchor synthetic seed data to the same real-world
#     "today" reference other agents already use (e.g. a `WINDOW_END` constant equal to
#     `assortment_planning`'s), with historical windows overlapping the range other agents already
#     span, so a user (or a single conversation spanning multiple agents) sees one coherent
#     timeline, not mismatched eras.
#
# Update this file in the same change that scaffolds a new agent's data/ folder, or adds/renames/
# drops one of its tables. Both `domain_id` and `agent_id` must be exactly 4 lowercase letters
# and, once assigned, must never change — table names loaded under the old id would silently
# orphan. `agent_id` is also still required to be unique across the *entire* registry, not just
# within its own domain — a stronger, cheap-to-keep invariant on top of the domain_id prefix.
#
# A domain's `display_name` here is also the source of truth for the "<domain display_name>:
# <agent display name>" naming convention applied to both the Agent Engine resource's
# `display_name` and the Gemini Enterprise registration's `--display-name` at deploy time (e.g.
# "Merchandising: Assortment Planning") -- added 2026-07-26 so agents are grouped/recognizable by
# domain in the Agent Engine console and Gemini Enterprise UI as more agents/domains are added.
# This isn't read by any script (deploys are manual, confirmed-before-execution, per this repo's
# established convention) -- it's the documented value a human copies at deploy/redeploy time.

dataset: retail_ent_agents
# Deliberately no `project:` field here: no script reads it (load_agent_data.py and
# grant_table_access.py both require an explicit --project flag at invocation time), and the
# real dev GCP project id is an environment fingerprint that shouldn't be committed here just for
# documentation's sake — see each agent's own (gitignored) deployment/dev.yaml for that.

domains:
  merchandising:
    domain_id: merc
    display_name: Merchandising
  supply_chain:
    domain_id: spch
    display_name: Supply Chain
  store_operations:
    domain_id: stop
    display_name: Store Operations
  finance:
    domain_id: finc
    display_name: Finance

agents:
  assortment_planning:
    domain: merchandising
    agent_id: aspl
    tables:
      - product_catalog             # -> merc_aspl_product_catalog
      - sales_by_sku                 # -> merc_aspl_sales_by_sku
      - planogram_space_allocation   # -> merc_aspl_planogram_space_allocation
  pricing_promotions:
    domain: merchandising
    agent_id: prpm
    tables:
      - product_catalog     # -> merc_prpm_product_catalog
      - price_history         # -> merc_prpm_price_history
      - promo_calendar         # -> merc_prpm_promo_calendar
      - promo_sales_lift        # -> merc_prpm_promo_sales_lift
  vendor_performance:
    domain: supply_chain
    agent_id: vepe
    tables:
      - product_catalog     # -> spch_vepe_product_catalog
      - vendors               # -> spch_vepe_vendors
      - purchase_orders        # -> spch_vepe_purchase_orders
      - vendor_scorecard        # -> spch_vepe_vendor_scorecard
  inventory_planning:
    domain: supply_chain
    agent_id: inpl
    tables:
      - product_catalog     # -> spch_inpl_product_catalog
      - inventory_position    # -> spch_inpl_inventory_position
      - demand_history          # -> spch_inpl_demand_history
  logistics_operations:
    domain: supply_chain
    agent_id: logi
    tables:
      - product_catalog     # -> spch_logi_product_catalog
      - carriers            # -> spch_logi_carriers
      - transit_lanes       # -> spch_logi_transit_lanes
      - shipments           # -> spch_logi_shipments
  labor_productivity:
    domain: store_operations
    agent_id: lprd
    tables:
      - stores                # -> stop_lprd_stores
      - hourly_foot_traffic   # -> stop_lprd_hourly_foot_traffic
      - hourly_staff_shifts   # -> stop_lprd_hourly_staff_shifts
      - store_labor_budgets   # -> stop_lprd_store_labor_budgets
  gross_margin_profitability:
    domain: finance
    agent_id: gmpr
    tables:
      - stores                    # -> finc_gmpr_stores
      - product_cost_master       # -> finc_gmpr_product_cost_master
      - sales_profitability       # -> finc_gmpr_sales_profitability
      - category_margin_targets   # -> finc_gmpr_category_margin_targets



