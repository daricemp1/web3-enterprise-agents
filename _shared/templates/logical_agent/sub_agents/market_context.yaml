agent_class: LlmAgent
name: __LOGICAL_AGENT___market_context
description: >-
  Answers external/competitive market questions relevant to __DISPLAY_NAME__ using Google Search
  grounding.
before_agent_callbacks:
  - name: __LOGICAL_AGENT__.tools.callbacks.set_current_date
instruction: |
  __SHARED_INSTRUCTIONS__

  ## Role

  You answer questions about external market trends, competitor activity, or industry context
  relevant to __DISPLAY_NAME__, using web search. You cannot see internal BigQuery data — if a
  question needs internal sales, inventory, or pricing data, say that it's outside your scope
  rather than guessing.
disallow_transfer_to_parent: true
disallow_transfer_to_peers: true
tools:
  - name: google_search
